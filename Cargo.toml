[package]
name = "nevo-messaging"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Microservices messaging framework wire-compatible with @riaskov/nevo-messaging: request/reply, events, pub/sub, broadcast over NATS with MessagePack/JSON, retry, circuit breaker, idempotency, ACL, discovery"
license = "MIT"
repository = "https://github.com/ARyaskov/nevo-messaging-rs"
homepage = "https://github.com/ARyaskov/nevo-messaging-rs"
documentation = "https://docs.rs/nevo-messaging"
readme = "README.md"
keywords = ["microservices", "nats", "messaging", "msgpack", "rpc"]
categories = ["network-programming", "asynchronous", "web-programming"]
exclude = [".github/", "tests/interop/node_modules/", "tests/interop/package-lock.json"]

[features]
default = ["nats", "msgpack", "compression"]
nats = ["dep:async-nats"]
msgpack = ["dep:rmp-serde"]
compression = ["dep:flate2"]
zstd = ["compression", "dep:zstd"]
metrics = ["dep:metrics"]

[dependencies]
async-nats = { version = "0.50", optional = true, default-features = false, features = ["ring", "jetstream", "nkeys", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
bytes = "1"
flate2 = { version = "1", optional = true }
futures = "0.3"
memchr = "2"
metrics = { version = "0.24", optional = true }
rand = "0.10"
rmp-serde = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "user_service"
required-features = ["nats"]

[[example]]
name = "caller"
required-features = ["nats"]
