name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run surfaces newly published RustSec/GitHub advisories even without pushes.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to commit SHAs; the trailing comment names the tag.
jobs:
  check:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --no-default-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not a service container: those cannot pass arguments to the image, and
      # JetStream needs `-js`. Fails the job if the broker does not come up.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true" && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Lockfile-exact install without lifecycle scripts.
      - name: Install the TypeScript peer
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/interop
      - run: cargo test --locked --all-features
        env:
          NEVO_TEST_NATS_URL: nats://127.0.0.1:4222
      - run: cargo test --locked --no-default-features --lib

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI is used directly (not gitleaks-action) so no licence key is needed,
      # and the tarball is checksum-verified before it runs.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif .

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  dependency-audit:
    name: Dependency audit (cargo audit, cargo deny, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      # Vulnerable, unmaintained and yanked crates in the committed lockfile all fail.
      - name: cargo audit (Cargo.lock)
        run: cargo audit --deny warnings

      # Advisories plus licence, duplicate/wildcard and registry policy from deny.toml.
      - name: cargo deny
        run: cargo deny check advisories bans licenses sources

      # Downstream users resolve fresh versions, so the scheduled run also audits
      # the newest semver-compatible graph.
      - name: cargo audit (fresh resolution)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cargo update
          cargo audit --deny warnings

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm audit (interop harness)
        run: npm audit --audit-level=moderate
        working-directory: tests/interop
