# cargo-deny policy, enforced in CI (`cargo deny check`).

[graph]
all-features = true

[advisories]
# RustSec advisories fail the build; yanked crates too. Add an `ignore` entry only
# with a reason and a tracking link.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
